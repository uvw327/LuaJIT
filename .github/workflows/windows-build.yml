name: build-windows-luajit

on:
  push:
  workflow_dispatch:

jobs:
  build-win64-gc64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc

      - name: Show toolchain
        run: |
          gcc --version | head -1
          make --version | head -1

      - name: Build (GC64)
        run: |
          cd src
          make -j"$(nproc)" CC=gcc XCFLAGS="-DLUAJIT_ENABLE_GC64"

      - name: Test
        run: |
          cd src
          ./luajit.exe -v
          ./luajit.exe -e "print(jit.version, jit.arch, jit.os)"
          ./luajit.exe -e "print(jit.status())"
          ./luajit.exe -e "local ffi=require('ffi') ffi.cdef[[int GetTickCount(void);]] print('ffi-ok', ffi.C.GetTickCount() > 0)"
          printf 'local a=1\n' > /tmp/t.lua
          ./luajit.exe -b -s /tmp/t.lua /tmp/t.bc
          head -c 5 /tmp/t.bc | od -An -tx1

      - name: Stage
        run: |
          set -e
          rm -rf stage
          mkdir -p stage/lua stage/include/luajit-2.1
          cp src/luajit.exe src/lua51.dll stage/
          cp -r src/jit stage/lua/jit
          cp src/lua.h src/luajit.h src/lualib.h src/lauxlib.h src/luaconf.h stage/include/luajit-2.1/
          find stage -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-2.1.0-beta3-win64-gc64
          path: stage
